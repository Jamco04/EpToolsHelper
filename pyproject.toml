[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eptools"
version = "0.2.0"
description = "Explain EnergyPlus warnings and run parameter studies. No AI, no dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
eptools = "eptools.__main__:main"

[project.gui-scripts]
eptools-gui = "eptools.gui:main"

[tool.setuptools]
packages = ["eptools"]
