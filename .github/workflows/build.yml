# Runs the tests on every push, and builds eptools.exe for Windows so the student
# doesn't need Python installed. Download it from the run's "Artifacts" section,
# or push a tag such as v0.2.0 to attach it to a GitHub Release.
name: test and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only to attach eptools.exe to a release on tag pushes

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: xvfb-run -a python -m unittest discover tests -v

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller==6.11.1
      - run: pyinstaller --onefile --windowed --name eptools eptools.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: eptools-windows
          path: dist/eptools.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/eptools.exe
