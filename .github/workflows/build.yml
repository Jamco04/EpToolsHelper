# Runs the tests on every push and builds eptools.exe for Windows, so nobody needs Python.
# Each push to main publishes the exe as a GitHub Release named after the version in
# eptools/__init__.py. Bump that version to make a new release.
name: test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only to attach eptools.exe to a release on tag pushes

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: xvfb-run -a python -m unittest discover tests -v

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller==6.11.1
      - run: pyinstaller --onefile --windowed --name eptools eptools.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: eptools-windows
          path: dist/eptools.exe
      - name: Read the version
        id: version
        shell: bash
        run: echo "v=$(python -c 'import eptools; print(eptools.__version__)')" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.v }}
          name: eptools ${{ steps.version.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Download **eptools.exe** below and double-click it. You also need EnergyPlus installed.
            See the README for how to use it.
          files: dist/eptools.exe
